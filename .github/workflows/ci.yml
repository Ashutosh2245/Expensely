name: CI - Test & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Run Backend Integration & Financial Math Tests
        env:
          NODE_ENV: test
          PORT: 5001
          JWT_SECRET: test_jwt_access_secret_min_32_characters_ci_workflow
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_min_32_characters_ci_workflow
        run: npm test

  frontend-build:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Compile TypeScript & Build Production Bundle
        env:
          VITE_API_URL: https://expensely-api.onrender.com/api
          VITE_SOCKET_URL: https://expensely-api.onrender.com
        run: npm run build
